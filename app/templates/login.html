{% extends "maestra.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="section">
    <div class="columns">
        <div class="column is-half">
            <h3 class="is-size-3">Iniciar sesión</h3>
            {# Sin action: se envía a la misma URL y conserva el ?next=... #}
            <form method="post">
                <label for="username">Usuario</label>
                <input required type="text" class="input" name="username" id="username">
                <label for="password">Contraseña</label>
                <input required type="password" class="input" name="password" id="password">
                <button type="submit" class="button is-success mt-2">Entrar</button>
                <a href="{{url_for('auth.registro')}}" class="button is-light mt-2">Crear cuenta</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
