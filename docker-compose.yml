services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: videojuegos
      MYSQL_USER: user
      MYSQL_PASSWORD: pwd
    volumes:
      - db_data:/var/lib/mysql
    # MySQL tarda ~20-30 s en estar listo la primera vez. Este chequeo le
    # pregunta cada 5 s si ya acepta conexiones (por TCP, igual que Flask).
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpwd"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy   # esperar a que MySQL esté LISTO, no solo encendido
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://user:pwd@db/videojuegos
      SECRET_KEY: "cambia_esta_clave"
      SESSION_COOKIE_SECURE: "False"   # True solo si se sirve por HTTPS

volumes:
  db_data:
